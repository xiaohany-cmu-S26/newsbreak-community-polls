<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Community Polls · Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: #1e1b4b; --ink-2: #4b5563; --muted: #8b8fa8; --line: #e0e7ff; --surface: #ffffff; --bg: #f5f3ff;
          --accent: #4f46e5; --accent-soft: #c7d2fe; --warn-bg: #fff7ed; --warn-ink: #7c2d12; --good: #15803d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--accent); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; text-transform: uppercase; }
  header .sub { color: #e0e7ff; font-size: 12.5px; }
  header label { margin-left: auto; font-size: 12.5px; color: #e0e7ff; display: flex; gap: 6px; align-items: center; }
  main { max-width: 1600px; margin: 0 auto; padding: 20px 24px 60px; }
  #polls { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 14px; align-items: start; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .stat span { color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 26px 0 10px; }
  .poll { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 0; min-width: 0; }
  .poll .top { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .q { font-size: 15px; font-weight: 800; margin: 0; flex: 1 1 260px; line-height: 1.3; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--line); color: var(--accent); white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; }
  .tag.agent { background: #dcfce7; color: var(--good); }
  .tag.flag { background: var(--warn-bg); color: var(--warn-ink); }
  .meta { color: var(--ink-2); font-size: 12px; margin: 6px 0 10px; overflow-wrap: anywhere; }
  .row { display: grid; grid-template-columns: minmax(120px, 1.3fr) 2fr 82px; gap: 8px; align-items: center; margin: 5px 0; font-size: 12.5px; }
  .track { height: 14px; background: #eef2ff; border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; transition: width .4s; min-width: 0; }
  .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .val small { color: var(--muted); }
  details { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
  summary { cursor: pointer; color: var(--accent); font-weight: 700; }
  table { border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
  th, td { padding: 4px 10px 4px 0; text-align: left; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  a { color: var(--accent); }
  ul { margin: 6px 0 0; padding-left: 18px; }
  .declined li, .recent li { margin: 4px 0; font-size: 13px; }
  .declined b { color: var(--warn-ink); font-weight: 700; }
  .recent time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
  .sim { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-style: italic; }
</style></head>
<body>
<header>
  <h1>📊 Community Polls · Admin</h1>
  <span class="sub" id="prov"></span>
  <label><input type="checkbox" id="auto" checked> auto-refresh (5 s)</label>
</header>
<main>
  <div class="stats" id="stats"></div>
  <h2>Polls</h2>
  <div id="polls"></div>
  <h2>Recent votes</h2>
  <ul class="recent" id="recent"></ul>
  <h2>Declined articles</h2>
  <ul class="declined" id="declined"></ul>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = (s) => (s || "").replace(/\b\w/g, (c) => c.toUpperCase());
const when = (iso) => { try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); } catch { return iso; } };

async function load() {
  const d = await (await fetch("/api/admin/polls")).json();
  prov.textContent = `provider: ${d.provider} · triage ${d.models.triage} · draft ${d.models.draft}`;
  stats.innerHTML = [
    [d.stats.polls, "polls"], [d.stats.votes, "votes"], [d.stats.agent_polls, "generated by agent"], [d.stats.declined, "declined articles"],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");

  polls.innerHTML = d.polls.length ? d.polls.map((p) => {
    // Bar length = share of all votes, same as the widget: the purple segments add up to one full bar.
    const rows = p.options.map((o, i) => {
      const share = p.total ? 100 * p.counts[i] / p.total : 0;
      return `<div class="row"><div>${esc(o)}</div><div class="track"><div class="bar" style="width:${share}%"></div></div><div class="val">${p.counts[i]} <small>${Math.round(share)}%</small></div></div>`;
    }).join("");
    const zips = Object.entries(p.by_zip).sort((a, b) => b[1].reduce((x, y) => x + y, 0) - a[1].reduce((x, y) => x + y, 0));
    const zipTable = zips.length ? `<table><tr><th>ZIP</th>${p.options.map((o, i) => `<th>opt ${i + 1}</th>`).join("")}<th>total</th></tr>` +
      zips.map(([z, c]) => `<tr><td>${esc(z)}</td>${c.map((n) => `<td>${n}</td>`).join("")}<td>${c.reduce((x, y) => x + y, 0)}</td></tr>`).join("") + "</table>" : `<div class="empty">no votes yet</div>`;
    const arts = p.articles.map((a) => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.headline)}</a> <span class="sim">${esc(a.article_id)}</span></li>`).join("");
    const critic = p.critic_passes ? `Critic: ${p.critic_passes} pass${p.critic_passes > 1 ? "es" : ""}, ${p.critic_passed ? "accepted" : "final draft still flagged"}${p.critic_issues.length ? ", caught: " + [...new Set(p.critic_issues.map((i) => i.type.replace(/_/g, " ")))].join(", ") : ""}` : "";
    return `<div class="poll">
      <div class="top"><p class="q">${esc(p.question)}</p>
        <span class="tag">${esc(cap(p.city.split(",")[0]))}</span>
        <span class="tag ${p.origin}">${p.origin === "agent" ? "agent-generated" : "seeded"}</span>
        ${p.critic_passes && !p.critic_passed ? '<span class="tag flag">critic flagged</span>' : ""}</div>
      <div class="meta"><b>${p.total}</b> votes · ZIPs ${esc(p.geo_scope.join(", ")) || "anyone"}${p.decision_date ? " · decision " + esc(p.decision_date) : ""}${p.origin === "agent" ? ` · ${p.n_calls} model calls, $${p.cost_usd}` : ""} · id <code>${esc(p.poll_id)}</code></div>
      ${rows}
      ${critic ? `<div class="meta">${esc(critic)}</div>` : ""}
      <details><summary>Votes by ZIP</summary>${zipTable}</details>
      <details><summary>Articles mapped to this poll (${p.articles.length})</summary><ul>${arts || "<li class='empty'>none</li>"}</ul></details>
    </div>`;
  }).join("") : `<div class="empty">no polls yet</div>`;

  recent.innerHTML = d.recent_votes.length ? d.recent_votes.map((v) =>
    `<li><time>${when(v.created_at)}</time>${esc(v.zip)} voted "<b>${esc(v.option)}</b>" on ${esc(v.question.slice(0, 80))}…${v.simulated ? ' <span class="sim">(simulated)</span>' : ""}</li>`).join("") : `<li class="empty">none yet</li>`;

  declined.innerHTML = d.declined.length ? d.declined.map((a) =>
    `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.headline)}</a> — <b>${esc(a.category)}</b>: ${esc(a.reason)}</li>`).join("") : `<li class="empty">none</li>`;
}
load();
setInterval(() => { if (auto.checked) load(); }, 5000);
</script>
</body></html>
